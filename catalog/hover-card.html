<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hover-card | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states="open closed"
      data-catalog-properties=""
      data-catalog-events="hover-card:beforetoggle hover-card:toggle"
    >
      <h1>hover-card</h1>
      <section>
        <h2>Link and preview button</h2>
        <div class="catalog-component catalog-hover-card" data-controller="hover-card">
          <a href="#profile" data-hover-card-target="trigger" aria-controls="hover-profile"
            >Hanako Yamada</a
          >
          <button type="button" data-hover-card-target="preview" aria-controls="hover-profile">
            Preview Hanako Yamada
          </button>
          <div
            id="hover-profile"
            class="catalog-hover-content"
            popover="manual"
            data-hover-card-target="content"
          >
            <h3>Hanako Yamada</h3>
            <p>Designer</p>
            <a href="#profile">Read profile</a>
            <button type="button">Follow</button>
            <button type="button" data-hover-card-target="close">Close preview</button>
          </div>
        </div>
      </section>
      <section dir="rtl">
        <h2>button・RTL</h2>
        <div class="catalog-component catalog-hover-card" data-controller="hover-card">
          <button
            type="button"
            data-hover-card-target="trigger"
            aria-controls="hover-button-content"
          >
            Contact details
          </button>
          <div
            id="hover-button-content"
            class="catalog-hover-content"
            popover="manual"
            data-hover-card-target="content"
          >
            <h3>Taro Sato</h3>
            <p>Engineer</p>
            <button type="button">Follow</button>
            <button type="button" data-hover-card-target="close">Close details</button>
          </div>
        </div>
      </section>
      <section id="profile">
        <h2>Profile</h2>
        <a href="#">Top of page</a>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
