<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>table-select | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states=""
      data-catalog-properties=""
      data-catalog-events="table-select:beforechange table-select:change"
    >
      <h1>table-select</h1>
      <section>
        <h2>table-select</h2>
        <table class="catalog-component" data-controller="table-select">
          <caption>
            Members
          </caption>
          <thead>
            <tr>
              <th scope="col">
                <input type="checkbox" data-table-select-target="all" aria-label="Select all" />
              </th>
              <th scope="col">Name</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <input
                  type="checkbox"
                  data-table-select-target="item"
                  data-table-select-value="aya"
                  aria-label="Select Aya"
                />
              </td>
              <td>Aya</td>
            </tr>
            <tr>
              <td>
                <input
                  type="checkbox"
                  data-table-select-target="item"
                  data-table-select-value="ken"
                  aria-label="Select Ken"
                />
              </td>
              <td>Ken</td>
            </tr>
          </tbody>
        </table>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
