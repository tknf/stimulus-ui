<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>landmark-navigation | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page" data-controller="landmark-navigation">
    <header><a href="./index.html">catalog</a></header>
    <main data-catalog-states="" data-catalog-properties="" data-catalog-events="">
      <h1>landmark-navigation</h1>
      <section>
        <h2>landmarks</h2>
        <nav
          class="catalog-component"
          data-landmark-navigation-target="landmark"
          aria-label="Site navigation"
        >
          <button type="button">Navigation</button>
        </nav>
        <aside
          class="catalog-component"
          data-landmark-navigation-target="landmark"
          aria-label="Additional"
        >
          <button type="button">Additional</button>
        </aside>
        <section
          class="catalog-component"
          data-landmark-navigation-target="landmark"
          role="region"
          aria-label="Additional information"
        >
          <button type="button">Additional information</button>
        </section>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
