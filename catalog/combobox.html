<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>combobox | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states="open closed selected active inactive disabled"
      data-catalog-properties=""
      data-catalog-events="combobox:beforechange combobox:change combobox:open combobox:close"
    >
      <h1>combobox</h1>
      <section>
        <h2>single</h2>
        <div class="catalog-component" data-controller="combobox" data-combobox-open-value="true">
          <label for="combobox-single-input">Color</label>
          <input
            id="combobox-single-input"
            type="text"
            data-combobox-target="input"
            role="combobox"
            aria-controls="combobox-single-listbox"
          />
          <ul id="combobox-single-listbox" data-combobox-target="listbox" role="listbox">
            <li data-combobox-target="option" data-combobox-value="red" role="option">Red</li>
            <li data-combobox-target="option" data-combobox-value="blue" role="option">Blue</li>
            <li data-combobox-target="option" data-combobox-value="green" role="option">Green</li>
            <li
              data-combobox-target="option"
              data-combobox-value="disabled"
              role="option"
              aria-disabled="true"
            >
              Disabled
            </li>
          </ul>
        </div>
      </section>
      <section>
        <h2>multiple</h2>
        <div
          class="catalog-component"
          data-controller="combobox"
          data-combobox-multiple-value="true"
          data-combobox-selected-value='["red", "blue"]'
        >
          <label for="combobox-multiple-input">Color</label>
          <input
            id="combobox-multiple-input"
            type="text"
            data-combobox-target="input"
            role="combobox"
            aria-controls="combobox-multiple-listbox"
          />
          <ul id="combobox-multiple-listbox" data-combobox-target="listbox" role="listbox">
            <li data-combobox-target="option" data-combobox-value="red" role="option">Red</li>
            <li data-combobox-target="option" data-combobox-value="blue" role="option">Blue</li>
            <li data-combobox-target="option" data-combobox-value="green" role="option">Green</li>
            <li
              data-combobox-target="option"
              data-combobox-value="disabled"
              role="option"
              aria-disabled="true"
            >
              Disabled
            </li>
          </ul>
        </div>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
