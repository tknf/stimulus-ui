<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>password-field | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states="visible hidden"
      data-catalog-properties=""
      data-catalog-events="password-field:beforetoggle password-field:toggle"
    >
      <h1>password-field</h1>
      <section>
        <h2>password-field</h2>
        <div class="catalog-component" data-controller="password-field">
          <label for="password-field-input">Password</label>
          <input
            id="password-field-input"
            type="password"
            name="password"
            data-password-field-target="input"
          />
          <button
            type="button"
            data-password-field-target="toggle"
            aria-controls="password-field-input"
          >
            Toggle visibility
          </button>
        </div>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
