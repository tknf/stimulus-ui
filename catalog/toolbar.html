<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>toolbar | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main data-catalog-states="" data-catalog-properties="" data-catalog-events="">
      <h1>toolbar</h1>
      <section>
        <h2>orientation horizontal</h2>
        <div
          class="catalog-component"
          data-controller="toolbar"
          role="toolbar"
          aria-label="Formatting"
        >
          <button type="button" data-toolbar-target="control">Bold</button>
          <button type="button" data-toolbar-target="control">Italic</button>
          <button type="button" data-toolbar-target="control">Underline</button>
        </div>
      </section>
      <section>
        <h2>orientation vertical</h2>
        <div
          class="catalog-component"
          data-controller="toolbar"
          data-toolbar-orientation-value="vertical"
          role="toolbar"
          aria-label="Formatting"
          aria-orientation="vertical"
        >
          <button type="button" data-toolbar-target="control">Bold</button>
          <button type="button" data-toolbar-target="control">Italic</button>
          <button type="button" data-toolbar-target="control">Underline</button>
        </div>
      </section>
      <section>
        <h2>rtl</h2>
        <div dir="rtl">
          <div
            class="catalog-component"
            data-controller="toolbar"
            role="toolbar"
            aria-label="Formatting"
          >
            <button type="button" data-toolbar-target="control">Bold</button>
            <button type="button" data-toolbar-target="control">Italic</button>
            <button type="button" data-toolbar-target="control">Underline</button>
          </div>
        </div>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
