<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>table-sort | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states="ascending descending none"
      data-catalog-properties=""
      data-catalog-events="table-sort:beforesort table-sort:sort"
    >
      <h1>table-sort</h1>
      <section>
        <h2>table-sort</h2>
        <table class="catalog-component" data-controller="table-sort">
          <caption>
            Sales
          </caption>
          <thead>
            <tr>
              <th data-table-sort-target="sortable" data-table-sort-column="name" scope="col">
                <button type="button">Name</button>
              </th>
              <th data-table-sort-target="sortable" data-table-sort-column="amount" scope="col">
                <button type="button">Amount</button>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Aya</td>
              <td>100</td>
            </tr>
            <tr>
              <td>Ken</td>
              <td>120</td>
            </tr>
          </tbody>
        </table>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
