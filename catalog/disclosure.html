<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>disclosure | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states="open closed"
      data-catalog-properties=""
      data-catalog-events="disclosure:beforetoggle disclosure:toggle"
    >
      <h1>disclosure</h1>
      <section>
        <h2>Standalone</h2>
        <details class="catalog-component" data-controller="disclosure" open>
          <summary data-disclosure-target="trigger">Details</summary>
          <div data-disclosure-target="panel">Content</div>
        </details>
      </section>
      <section>
        <h2>Multiple details grouped by the name attribute</h2>
        <details
          class="catalog-component"
          data-controller="disclosure"
          name="catalog-disclosure-group"
          open
        >
          <summary data-disclosure-target="trigger">Item 1</summary>
          <div data-disclosure-target="panel">Content 1</div>
        </details>
        <details
          class="catalog-component"
          data-controller="disclosure"
          name="catalog-disclosure-group"
        >
          <summary data-disclosure-target="trigger">Item 2</summary>
          <div data-disclosure-target="panel">Content 2</div>
        </details>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
