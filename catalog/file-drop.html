<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>file-drop | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states="dragover idle"
      data-catalog-properties=""
      data-catalog-events="file-drop:beforedrop file-drop:drop"
    >
      <h1>file-drop</h1>
      <section>
        <h2>Single</h2>
        <div class="catalog-component" data-controller="file-drop">
          <p>Drop files</p>
          <label for="file-drop-single-input">Choose files</label>
          <input id="file-drop-single-input" type="file" data-file-drop-target="input" />
        </div>
      </section>
      <section>
        <h2>Native input multiple attribute</h2>
        <div class="catalog-component" data-controller="file-drop">
          <p>Drop files</p>
          <label for="file-drop-multiple-input">Choose files</label>
          <input id="file-drop-multiple-input" type="file" multiple data-file-drop-target="input" />
        </div>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
