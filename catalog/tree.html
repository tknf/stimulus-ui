<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tree | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states="disabled active selected inactive"
      data-catalog-properties=""
      data-catalog-events="tree:beforechange tree:change tree:beforetoggle tree:toggle"
    >
      <h1>tree</h1>
      <section>
        <h2>Initially expanded</h2>
        <ul
          class="catalog-component"
          data-controller="tree"
          data-tree-expanded-value='["projects"]'
          data-tree-value-value="design"
          role="tree"
          aria-label="Files"
        >
          <li data-tree-target="item" data-tree-value="projects" role="treeitem">
            <span>Project</span>
            <button type="button" data-tree-target="toggle" aria-label="Expand">Expand</button>
            <ul role="group">
              <li data-tree-target="item" data-tree-value="design" role="treeitem">Design</li>
              <li data-tree-target="item" data-tree-value="development" role="treeitem">
                Development
              </li>
            </ul>
          </li>
          <li
            data-tree-target="item"
            data-tree-value="archive"
            role="treeitem"
            aria-disabled="true"
          >
            Archive
          </li>
        </ul>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
