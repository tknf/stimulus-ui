<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dropdown-menu | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states="open closed active inactive disabled"
      data-catalog-properties="--dropdown-menu-x --dropdown-menu-y"
      data-catalog-events="dropdown-menu:beforeopen dropdown-menu:open dropdown-menu:beforeclose dropdown-menu:close dropdown-menu:select"
    >
      <h1>dropdown-menu</h1>
      <section>
        <h2>dropdown-menu</h2>
        <div class="catalog-component" data-controller="dropdown-menu">
          <button
            type="button"
            data-dropdown-menu-target="trigger"
            aria-label="Actions"
            aria-haspopup="menu"
            aria-controls="catalog-dropdown-menu"
          >
            Actions
          </button>
          <menu
            id="catalog-dropdown-menu"
            data-dropdown-menu-target="menu"
            role="menu"
            aria-label="Actions"
          >
            <li role="none">
              <button
                type="button"
                data-dropdown-menu-target="item"
                data-dropdown-menu-value="edit"
                aria-label="Edit"
                role="menuitem"
              >
                Edit
              </button>
            </li>
            <li role="none">
              <button
                type="button"
                data-dropdown-menu-target="item"
                data-dropdown-menu-value="archive"
                aria-label="Archive"
                role="menuitem"
              >
                Archive
              </button>
            </li>
            <li role="none">
              <button
                type="button"
                data-dropdown-menu-target="item"
                data-dropdown-menu-value="disabled"
                aria-label="Disabled"
                role="menuitem"
                disabled
              >
                Disabled
              </button>
            </li>
          </menu>
        </div>
      </section>
      <section>
        <h2>Context interaction, RTL</h2>
        <div class="catalog-component catalog-context-menu" data-controller="dropdown-menu">
          <button
            type="button"
            data-dropdown-menu-target="trigger"
            aria-label="Item actions"
            aria-haspopup="menu"
            aria-controls="catalog-context-menu"
          >
            Item actions
          </button>
          <div
            class="catalog-context-region"
            data-dropdown-menu-target="context"
            role="group"
            aria-label="Interaction target"
            tabindex="0"
            dir="rtl"
          >
            <button class="catalog-context-source" type="button">Target item</button>
          </div>
          <menu
            id="catalog-context-menu"
            class="catalog-context-popup"
            data-dropdown-menu-target="menu"
            role="menu"
            aria-label="Item actions"
          >
            <li role="none">
              <button
                type="button"
                role="menuitem"
                data-dropdown-menu-target="item"
                data-dropdown-menu-value="edit"
                aria-label="Edit"
              >
                Edit
              </button>
            </li>
            <li role="none">
              <button
                type="button"
                role="menuitem"
                data-dropdown-menu-target="item"
                data-dropdown-menu-value="archive"
                aria-label="Archive"
              >
                Archive
              </button>
            </li>
          </menu>
        </div>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
