<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>time-field | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states="min max between"
      data-catalog-properties=""
      data-catalog-events="time-field:beforechange time-field:change"
    >
      <h1>time-field</h1>
      <section>
        <h2>time-field</h2>
        <label for="time-field-input">Time</label>
        <input
          id="time-field-input"
          class="catalog-component"
          type="time"
          name="time"
          min="09:00"
          max="18:00"
          step="900"
          value="12:00"
          data-controller="time-field"
        />
        <span class="catalog-state" aria-hidden="true"></span>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
