<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>listbox | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states="active selected inactive disabled"
      data-catalog-properties=""
      data-catalog-events="listbox:beforechange listbox:change"
    >
      <h1>listbox</h1>
      <section>
        <h2>single</h2>
        <ul class="catalog-component" data-controller="listbox" role="listbox" aria-label="Color">
          <li data-listbox-target="option" data-listbox-value="red" role="option">Red</li>
          <li data-listbox-target="option" data-listbox-value="blue" role="option">Blue</li>
          <li data-listbox-target="option" data-listbox-value="green" role="option">Green</li>
          <li
            data-listbox-target="option"
            data-listbox-value="disabled"
            role="option"
            aria-disabled="true"
          >
            Disabled
          </li>
        </ul>
      </section>
      <section>
        <h2>multiple</h2>
        <ul
          class="catalog-component"
          data-controller="listbox"
          data-listbox-multiple-value="true"
          data-listbox-value-value="red,blue"
          role="listbox"
          aria-label="Color"
        >
          <li data-listbox-target="option" data-listbox-value="red" role="option">Red</li>
          <li data-listbox-target="option" data-listbox-value="blue" role="option">Blue</li>
          <li data-listbox-target="option" data-listbox-value="green" role="option">Green</li>
          <li
            data-listbox-target="option"
            data-listbox-value="disabled"
            role="option"
            aria-disabled="true"
          >
            Disabled
          </li>
        </ul>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
