<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>number-field | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states="min max between"
      data-catalog-properties=""
      data-catalog-events="number-field:beforechange number-field:change"
    >
      <h1>number-field</h1>
      <section>
        <h2>number-field</h2>
        <label for="number-field-input">Quantity</label>
        <input
          id="number-field-input"
          class="catalog-component"
          type="number"
          name="quantity"
          min="0"
          max="100"
          step="1"
          value="10"
          data-controller="number-field"
          data-number-field-page-step-value="10"
        />
        <span class="catalog-state" aria-hidden="true"></span>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
