<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>toast | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states="visible hidden"
      data-catalog-properties=""
      data-catalog-events="toast:beforeshow toast:show toast:beforehide toast:hide"
    >
      <h1>toast</h1>
      <section>
        <h2>Zero duration and dismiss target</h2>
        <div class="catalog-component" data-controller="toast" role="status" aria-live="polite">
          <p>Changes saved.</p>
          <button type="button" data-toast-target="dismiss">Close</button>
          <button type="button" data-action="click->toast#hide click->toast#show">
            Show again
          </button>
        </div>
      </section>
      <section>
        <h2>Positive duration</h2>
        <button type="button" popovertarget="catalog-timed-toast">Show</button>
        <div
          id="catalog-timed-toast"
          class="catalog-component"
          data-controller="toast"
          data-toast-duration-value="5000"
          popover="manual"
          role="status"
          aria-live="polite"
        >
          <p>Updated.</p>
        </div>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
