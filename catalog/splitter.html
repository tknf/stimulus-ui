<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>splitter | catalog</title>
    <link rel="stylesheet" href="./catalog.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body class="catalog-page">
    <header><a href="./index.html">catalog</a></header>
    <main
      data-catalog-states="collapsed expanded dragging idle"
      data-catalog-properties="--splitter-value"
      data-catalog-events="splitter:beforechange splitter:change"
    >
      <h1>splitter</h1>
      <section>
        <h2>orientation vertical</h2>
        <div class="catalog-component catalog-splitter" data-controller="splitter">
          <div id="splitter-vertical-primary" data-splitter-target="primary">Primary region</div>
          <input
            type="range"
            data-splitter-target="range"
            aria-label="Primary ratio, vertical separator"
          />
          <div
            data-splitter-target="handle"
            role="separator"
            tabindex="0"
            aria-label="Region boundary"
            aria-controls="splitter-vertical-primary"
          ></div>
          <div>Secondary region</div>
        </div>
      </section>
      <section>
        <h2>orientation horizontal</h2>
        <div
          class="catalog-component catalog-splitter"
          data-controller="splitter"
          data-splitter-orientation-value="horizontal"
        >
          <div id="splitter-horizontal-primary" data-splitter-target="primary">Primary region</div>
          <input
            type="range"
            data-splitter-target="range"
            aria-label="Primary ratio, horizontal separator"
          />
          <div
            data-splitter-target="handle"
            role="separator"
            tabindex="0"
            aria-label="Region boundary"
            aria-controls="splitter-horizontal-primary"
          ></div>
          <div>Secondary region</div>
        </div>
      </section>
      <section>
        <h2>rtl</h2>
        <div dir="rtl">
          <div class="catalog-component catalog-splitter" data-controller="splitter">
            <div id="splitter-rtl-primary" data-splitter-target="primary">Primary region</div>
            <input
              type="range"
              data-splitter-target="range"
              aria-label="Primary ratio, RTL separator"
            />
            <div
              data-splitter-target="handle"
              role="separator"
              tabindex="0"
              aria-label="Region boundary"
              aria-controls="splitter-rtl-primary"
            ></div>
            <div>Secondary region</div>
          </div>
        </div>
      </section>
      <ul class="catalog-events" role="log"></ul>
    </main>
  </body>
</html>
